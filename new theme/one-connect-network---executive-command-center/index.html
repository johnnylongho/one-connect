    <script>
      // Defensive shim for browser extensions attempting to assign to window.fetch
      try {
        const _origFetch = window.fetch.bind(window);
        let _currentFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _currentFetch; },
          set: function(fn) { _currentFetch = fn; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {}
    </script>
